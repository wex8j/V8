<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>V8 Sound Mixer - Pro Effects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #0a0a15 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .mixer {
            max-width: 550px;
            width: 100%;
            background: #0f0f1a;
            border-radius: 45px;
            padding: 20px 18px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .v8-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .v8-title h1 {
            font-size: 44px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd89b, #c7e9fb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            background: #1a1a2a;
            padding: 12px;
            border-radius: 40px;
        }
        .power-btn {
            background: #cc3366;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .mute-btn {
            background: #444466;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .slider-group {
            flex: 1;
            text-align: center;
            min-width: 60px;
        }
        .slider-group label {
            color: #aaa;
            font-size: 10px;
            display: block;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 5px;
            background: #333;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff8844;
            cursor: pointer;
        }

        .pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 15px 0;
        }
        .sound-btn {
            background: linear-gradient(145deg, #252540, #1a1a2f);
            border: none;
            padding: 14px 0;
            border-radius: 28px;
            font-weight: bold;
            font-size: 14px;
            color: #f0f0ff;
            box-shadow: 0 5px 0 #0a0a12;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .sound-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0a0a12;
        }

        footer {
            text-align: center;
            font-size: 10px;
            color: #555;
            margin-top: 15px;
        }
        
        .effect-badge {
            background: #ff884422;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 11px;
            color: #ffaa66;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="mixer">
    <div class="v8-title">
        <h1>V8 PRO</h1>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls-row">
        <button class="power-btn" id="powerBtn">⚡ POWER</button>
        <button class="mute-btn" id="muteBgBtn">🔇 كتم خلفية</button>
        <div class="slider-group">
            <label>🎚️ ECHO</label>
            <input type="range" id="echoSlider" min="0" max="100" value="30">
        </div>
        <div class="slider-group">
            <label>🔊 TREBLE</label>
            <input type="range" id="trebleSlider" min="0" max="100" value="50">
        </div>
        <div class="slider-group">
            <label>🎵 BASS</label>
            <input type="range" id="bassSlider" min="0" max="100" value="60">
        </div>
    </div>

    <div class="effect-badge">
        🎤 أزرار المؤثرات: اضغط لتسمع التأثير
    </div>

    <!-- أزرار V8 الكاملة -->
    <div class="pad-grid">
        <button class="sound-btn" data-sound="electro">🔊 Electro</button>
        <button class="sound-btn" data-sound="pitch">🎚️ Pitch Bend</button>
        <button class="sound-btn" data-sound="shot">🔫 Shot</button>
        <button class="sound-btn" data-sound="beating">💓 Beating</button>
        <button class="sound-btn" data-sound="coldfield">❄️ Coldfield</button>
        <button class="sound-btn" data-sound="songs">🎵 Songs</button>
        <button class="sound-btn" data-sound="dog">🐕 DogBarking</button>
        <button class="sound-btn" data-sound="applause">👏 Applause</button>
        <button class="sound-btn" data-sound="kiss">💋 Kiss</button>
        <button class="sound-btn" data-sound="awkward">😬 Awkward</button>
        <button class="sound-btn" data-sound="minions">🍌 Minions</button>
        <button class="sound-btn" data-sound="giant">🗿 عملاق</button>
    </div>

    <!-- صف ثاني للأصوات الإضافية -->
    <div class="pad-grid">
        <button class="sound-btn" data-sound="chipmunk">🐿️ سنجاب</button>
        <button class="sound-btn" data-sound="laugh">😄 ضحكة</button>
        <div style="visibility: hidden;"></div>
    </div>

    <footer>🔊 الأصوات كلها تشتغل مع ECHO - BASS - TREBLE</footer>
</div>

<script>
    // ============================================================
    // V8 Sound Mixer - كامل الأصوات مع مؤثرات ECHO/BASS/TREBLE
    // ============================================================
    
    let audioCtx = null;
    let isPowerOn = true;
    let isMuteBackground = false;
    let backgroundNoiseNode = null;
    
    // المرشحات
    let bassFilter = null;
    let trebleFilter = null;
    let echoDelay = null;
    let echoMix = null;
    let masterGain = null;
    
    // تهيئة السياق الصوتي
    function initAudioContext() {
        if (audioCtx && audioCtx.state !== 'closed') return;
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // إنشاء العقد
        masterGain = audioCtx.createGain();
        bassFilter = audioCtx.createBiquadFilter();
        trebleFilter = audioCtx.createBiquadFilter();
        
        bassFilter.type = "lowshelf";
        bassFilter.frequency.value = 200;
        bassFilter.gain.value = 6;
        
        trebleFilter.type = "highshelf";
        trebleFilter.frequency.value = 3000;
        trebleFilter.gain.value = 3;
        
        // توصيل المسار الرئيسي
        masterGain.connect(bassFilter);
        bassFilter.connect(trebleFilter);
        trebleFilter.connect(audioCtx.destination);
        
        updateFilters();
    }
    
    function updateFilters() {
        if (!bassFilter || !trebleFilter) return;
        let bassVal = parseFloat(document.getElementById('bassSlider').value);
        let trebleVal = parseFloat(document.getElementById('trebleSlider').value);
        let bassDb = (bassVal / 100) * 24 - 12;
        let trebleDb = (trebleVal / 100) * 20 - 10;
        bassFilter.gain.value = bassDb;
        trebleFilter.gain.value = trebleDb;
    }
    
    // إضافة echo للمسار
    function applyEchoToSource(source, gainNode) {
        let echoAmount = parseFloat(document.getElementById('echoSlider').value) / 100;
        if (echoAmount <= 0.05) {
            gainNode.connect(masterGain);
            return;
        }
        
        let delayNode = audioCtx.createDelay();
        let wetGain = audioCtx.createGain();
        let dryGain = audioCtx.createGain();
        
        delayNode.delayTime.value = 0.28;
        wetGain.gain.value = echoAmount * 0.6;
        dryGain.gain.value = 0.8;
        
        gainNode.connect(dryGain);
        gainNode.connect(delayNode);
        delayNode.connect(wetGain);
        
        dryGain.connect(masterGain);
        wetGain.connect(masterGain);
    }
    
    // تشغيل صوت نغمة عادية
    function playTone(frequency, duration, volume, type = 'sine') {
        if (!isPowerOn) return;
        if (!audioCtx) initAudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.value = frequency;
        
        osc.connect(gainNode);
        
        let now = audioCtx.currentTime;
        gainNode.gain.setValueAtTime(volume, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
        
        // تطبيق الإيكو والمرشحات
        applyEchoToSource(osc, gainNode);
        
        osc.start();
        osc.stop(now + duration);
    }
    
    // تشغيل ضوضاء (للتصفيق والطلقات)
    function playNoise(duration, volume) {
        if (!isPowerOn) return;
        if (!audioCtx) initAudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        let bufferSize = 4096;
        let noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
        let gainNode = audioCtx.createGain();
        
        noiseNode.onaudioprocess = function(e) {
            let output = e.outputBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = (Math.random() * 2 - 1) * volume;
            }
        };
        
        noiseNode.connect(gainNode);
        applyEchoToSource(null, gainNode);
        
        gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        setTimeout(() => {
            try {
                noiseNode.disconnect();
            } catch(e) {}
        }, duration * 1000);
    }
    
    // ============= الأصوات حسب الأزرار =============
    function playSoundEffect(type) {
        if (!isPowerOn) return;
        if (!audioCtx) initAudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        switch(type) {
            case 'electro':
                playTone(880, 0.3, 0.5, 'sawtooth');
                break;
            case 'pitch':
                // Pitch bend: نغمة متغيرة
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
                osc.connect(gainNode);
                applyEchoToSource(osc, gainNode);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
                break;
            case 'shot':
                playNoise(0.2, 0.5);
                break;
            case 'beating':
                playTone(120, 0.4, 0.45, 'triangle');
                break;
            case 'coldfield':
                playTone(196, 0.8, 0.4, 'sine');
                break;
            case 'songs':
                playTone(293.66, 0.7, 0.5, 'sine');
                break;
            case 'dog':
                let oscDog = audioCtx.createOscillator();
                let gainDog = audioCtx.createGain();
                oscDog.frequency.setValueAtTime(900, audioCtx.currentTime);
                oscDog.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
                oscDog.frequency.setValueAtTime(650, audioCtx.currentTime + 0.15);
                oscDog.connect(gainDog);
                applyEchoToSource(oscDog, gainDog);
                gainDog.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainDog.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                oscDog.start();
                oscDog.stop(audioCtx.currentTime + 0.3);
                break;
            case 'applause':
                playNoise(0.6, 0.4);
                break;
            case 'kiss':
                playTone(880, 0.15, 0.3, 'sine');
                break;
            case 'awkward':
                playTone(311, 0.9, 0.35, 'sine');
                break;
            case 'minions':
                playTone(523.25, 0.45, 0.55, 'square');
                break;
            case 'giant':  // صوت عملاق (Deep voice)
                let oscGiant = audioCtx.createOscillator();
                let gainGiant = audioCtx.createGain();
                oscGiant.type = 'sine';
                oscGiant.frequency.value = 70;
                oscGiant.connect(gainGiant);
                applyEchoToSource(oscGiant, gainGiant);
                gainGiant.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gainGiant.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                oscGiant.start();
                oscGiant.stop(audioCtx.currentTime + 0.8);
                break;
            case 'chipmunk':  // صوت سنجاب (Chipmunk)
                let oscChip = audioCtx.createOscillator();
                let gainChip = audioCtx.createGain();
                oscChip.type = 'sine';
                oscChip.frequency.value = 1400;
                oscChip.connect(gainChip);
                applyEchoToSource(oscChip, gainChip);
                gainChip.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainChip.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                oscChip.start();
                oscChip.stop(audioCtx.currentTime + 0.35);
                break;
            case 'laugh':  // صوت ضحكة
                playLaugh();
                break;
            default:
                playTone(440, 0.3, 0.4, 'sine');
        }
    }
    
    // تشغيل صوت ضحكة مركب
    function playLaugh() {
        if (!isPowerOn) return;
        if (!audioCtx) initAudioContext();
        
        // سلسلة من النغمات السريعة تحاكي الضحكة
        let notes = [523, 587, 659, 523, 587, 659, 784];
        let times = [0, 0.12, 0.24, 0.4, 0.52, 0.64, 0.8];
        
        notes.forEach((freq, i) => {
            setTimeout(() => {
                if (isPowerOn) {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    applyEchoToSource(osc, gain);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }
            }, times[i] * 1000);
        });
    }
    
    // كتم ضوضاء الخلفية (يمنع الأصوات الخلفية من النظام)
    function toggleMuteBackground() {
        isMuteBackground = !isMuteBackground;
        const btn = document.getElementById('muteBgBtn');
        
        if (isMuteBackground) {
            btn.style.background = "#cc3333";
            btn.innerHTML = "🔇 كتم نشط";
            // إضافة عزل للضوضاء
            if (audioCtx) {
                // مرشح عالي يقطع الترددات المنخفضة للخلفية
                let highpass = audioCtx.createBiquadFilter();
                highpass.type = "highpass";
                highpass.frequency.value = 80;
                masterGain.disconnect();
                masterGain.connect(highpass);
                highpass.connect(bassFilter);
            }
        } else {
            btn.style.background = "#444466";
            btn.innerHTML = "🔇 كتم خلفية";
            if (audioCtx) {
                // إعادة التوصيل العادي
                masterGain.disconnect();
                masterGain.connect(bassFilter);
            }
        }
    }
    
    // ربط الأزرار
    document.querySelectorAll('.sound-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            let soundType = btn.getAttribute('data-sound');
            if(soundType) {
                playSoundEffect(soundType);
            }
            btn.style.transform = "scale(0.96)";
            setTimeout(() => { btn.style.transform = ""; }, 100);
        });
    });
    
    // أزرار التحكم
    document.getElementById('powerBtn').addEventListener('click', () => {
        isPowerOn = !isPowerOn;
        const powerBtn = document.getElementById('powerBtn');
        powerBtn.style.opacity = isPowerOn ? "1" : "0.5";
        if(masterGain) masterGain.gain.value = isPowerOn ? 1 : 0;
    });
    
    document.getElementById('muteBgBtn').addEventListener('click', toggleMuteBackground);
    document.getElementById('bassSlider').addEventListener('input', updateFilters);
    document.getElementById('trebleSlider').addEventListener('input', updateFilters);
    
    // بدء التشغيل عند أول لمسة
    document.body.addEventListener('touchstart', () => {
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });
    
    window.addEventListener('load', () => {
        initAudioContext();
        console.log("✅ V8 Mixer جاهز - كل الأصوات تشتغل مع ECHO, BASS, TREBLE");
    });
</script>
</body>
</html>
